<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LensIt 控制台</title>
<style>
  :root { --bg:#0f1115; --bar:#1b1f27; --accent:#3ddcff; --fg:#e8ecf2; --dim:#8c96a5; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px; background:var(--bar); border-bottom:1px solid #2a2f3a; position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .dot { width:9px; height:9px; border-radius:50%; background:#52c41a; }
  header .dot.bad { background:#ff4d4f; }
  header button { margin-left:8px; }
  main { padding: 16px 20px; max-width: 980px; margin: 0 auto; }
  section { margin-bottom: 22px; }
  h2 { font-size:14px; color:var(--dim); font-weight:600; border-left:3px solid var(--accent); padding-left:8px; }
  .card { background:var(--bar); border:1px solid #2a2f3a; border-radius:8px; padding:14px 16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  label { display:block; font-size:12px; color:var(--dim); margin-bottom:4px; }
  input, select { width:100%; background:#12151c; color:var(--fg); border:1px solid #2a2f3a; border-radius:5px; padding:7px 9px; font-size:13px; }
  input[type=color] { padding:2px; height:36px; }
  button { background:#265ffe; color:#fff; border:0; border-radius:5px; padding:8px 16px; font-size:13px; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid #3a4150; color:var(--fg); }
  button:hover { filter:brightness(1.15); }
  .toast { position:fixed; top:14px; right:14px; background:#52c41a; color:#fff; padding:9px 16px; border-radius:6px; font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:99; }
  .toast.show { opacity:1; }
  .hist { display:flex; flex-direction:column; gap:10px; }
  .item { display:flex; gap:14px; align-items:center; background:var(--bar); border:1px solid #2a2f3a; border-radius:8px; padding:10px 14px; }
  .item img { width:150px; height:95px; object-fit:contain; background:#000; border-radius:5px; border:1px solid #2a2f3a; }
  .item .ph { width:150px; height:95px; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:12px; background:#12151c; border-radius:5px; }
  .item .meta { flex:1; }
  .item .meta b { font-weight:600; }
  .item .meta span { color:var(--dim); font-size:12px; margin-right:12px; }
  .empty { color:var(--dim); text-align:center; padding:26px 0; font-size:13px; }
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <h1>LensIt 控制台</h1>
  <span style="color:var(--dim);font-size:12px" id="dbinfo"></span>
  <span style="flex:1"></span>
  <button class="ghost" id="btn-start">开始标注</button>
  <button class="ghost" id="btn-refresh">刷新历史</button>
</header>
<main>
  <section>
    <h2>设置</h2>
    <div class="card grid">
      <div><label>开始标注热键</label>
        <select id="s-hotkey">
          <option>Ctrl+Alt+L</option><option>Ctrl+Alt+X</option><option>Ctrl+Alt+K</option>
          <option>Ctrl+Shift+L</option><option>Ctrl+Shift+Z</option>
        </select></div>
      <div><label>放大镜半径（60–400 px）</label><input id="s-radius" type="number" min="60" max="400" step="10"></div>
      <div><label>默认放大倍率（1.5–8×）</label><input id="s-zoom" type="number" min="1.5" max="8" step="0.5"></div>
      <div><label>默认画笔颜色</label><input id="s-color" type="color"></div>
      <div><label>默认画笔宽度（1–30 px）</label><input id="s-width" type="number" min="1" max="30" step="1"></div>
    </div>
    <div style="margin-top:12px"><button id="btn-save">保存设置</button></div>
  </section>
  <section>
    <h2>标注历史（保存在本机数据库）</h2>
    <div class="hist" id="hist"><div class="empty">加载中…</div></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script src="console.js"></script>
</body>
</html>
